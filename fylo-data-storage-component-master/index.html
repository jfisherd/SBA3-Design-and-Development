<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>SBA 3, Frontend Mentor | Fylo data storage component</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="row">
    <div class="col leftSide">
      <img class="" src="images/logo.svg" alt="Fylo logo.">
      <nav class="nav">
        <img class="navDocument" src="images/icon-document.svg" alt="Document icon.">
        <img class="navFolder" src="images/icon-folder.svg" alt="Folder icon.">
        <img class="navUpload" src="images/icon-upload.svg" alt="Upload icon.">
      </nav>
    </div>
    <div class="col rightSide">
      <div class="storageUsed">You’ve used 815 GB of your storage</div>
      <div class="storageRemaining">185 GB Left</div>
      <div class="graphContainer">
        <div>graph background</div>
        <div>graph gradient</div>
        <div>graph circle</div>
      </div>
      <div class="storageInfoContainer">
        <div>0 GB</div>
        <div>1000 GB</div>
      </div>
    </div>
  </div>

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </div>
</body>

</html>
